name: "🐞 Bug Report"
description: Report a bug or unexpected behavior
title: "[BUG] "
labels:
  - bug

body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Add screenshots if applicable.

  - type: textarea
    id: additional
    attributes:
      label: Additional information